name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v5

      # Use Node.js 24 required by Angular 24
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Angular application
      - name: Build Angular
        run: npm run build

      # Deploy already-built application to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_SKY_082DF6003 }}
          action: upload

          # IMPORTANT:
          # Since the Angular app was already built above,
          # app_location points directly to the build output.
          app_location: "dist/radim-smilek-a/browser"

          # No API
          api_location: ""

          # Azure must not build the app again
          skip_app_build: true
          skip_api_build: true

          # Must be empty when skip_app_build is true
          output_location: ""